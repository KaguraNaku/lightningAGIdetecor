# Native ForAda auxiliary targets require sha256-bound metadata.forada_mask on fake source rows.
version: 1
seed: 1020
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/benchmark-eight/forada
model:
  factory: detectors.forada.experiment:create_task
  base_clip_checkpoint: /absolute/path/to/ViT-L-14.pt
  augmentation: false
loader:
  batch_size: 16
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 60
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
