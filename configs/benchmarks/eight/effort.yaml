# Shared 8-frame training / 32-frame evaluation membership; method-owned model and optimization.
# Initialization assets must be provided; this file does not start a training job.
version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/benchmark-eight/effort
model:
  factory: detectors.effort.experiment:create_task
  backbone_id: openai/clip-vit-large-patch14
  revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  attention_implementation: sdpa
  retained_rank: 1023
loader:
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  decode_error_patience: 10
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    split: train
    shuffle: true
  validation:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    split: val
    batch_size: 8
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    split: test
    batch_size: 8
fit:
  input: training
  validation_input: validation
  epochs: 10
  patience: 2
  min_delta: 0.0001
  microbatch_size: 8
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
