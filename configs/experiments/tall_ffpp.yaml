# Actual local train.py entry: generic T4 data,ImageNet normalization,no cutout.
# Explicit alternative model.data_profile=specialized_cutout selects the separately
# defined specialized body,including stochastic all-stage normalized -1 cutout.
# Both recipes need complete all-frame manifests and retain whole native batch32.
# CPU saved activations are exact and retained. Set adequate persistent storage:
# the20GiB cumulative default budget stops larger jobs before storage exhaustion.
# Activation writes also preserve3GiB for atomic full-model/Adam checkpoint writes.
# This preset is not a claim of full FFPP training or native CUDA AMP reproduction.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: /absolute/path/to/tall-runs
model:
  factory: detectors.tall.experiment:create_task
  initialization: random
  data_profile: native_entrypoint
  score_type: probability
  selection_seed: 1024
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-all-frames.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-all-frames.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-all-frames.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 101
  monitor: clip.auc
  learning_rate: 0.00002
  weight_decay: 0.0005
  disk_saved_tensors: true
  saved_activation_budget_gib: 20
  disk_reserve_gib: 8
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  group_by: []
