# Native MultiAttention warmup then AGDA/CE+RIL, RGB256 and batch32.
# Every forward, including evaluation, advances the native phase counter.
# Fill init_weights with the local ImageNet file. For random initialization,
# remove init_weights and set initialization: random. The native freshly
# replaced unpadded stem is preserved. This FFPP source-validation example
# differs from the original sampling and selection protocol.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/multi_attention_ffpp
model:
  factory: detectors.multi_attention.experiment:create_task
  augmentation: false
  backbone_nEpochs: 10
  batch_per_epoch: 3591
  init_weights: /absolute/path/to/efficientnet-b4-6ed6700e.pth
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 51
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.000001
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
