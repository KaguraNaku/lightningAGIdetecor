# Literal SBI: B4 internal ImageNet weights, THREE logits, class1 softmax score.
# Outer Xception import matched zero tensor keys and is omitted.
# Train manifests may contain both classes; real-only view filters BEFORE sampling.
# Real frames require256-coordinate landmark NPYs: native frames->landmarks paths,
# or metadata.landmarks={path,sha256,coordinate_size:256} for explicit sidecars.
# Source batch24 -> full ordered real-first/fake-second model batch48.
# Native51 sweeps, one post-fit StepLR; remake validation is not full reproduction.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/sbi_ffpp
model:
  factory: detectors.sbi.experiment:create_task
  init_weights: /absolute/path/to/efficientnet-b4-6ed6700e.pth
loader:
  batch_size: 24
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-8.jsonl
    batch_size: 32
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 51
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
