# Native STIL RGB224/T8,whole batch8,two-logit CE,inclusive0..10 epochs.
# Requires unlimited all-frame manifests with hash-bound files-first sidecars.
# Source training AND selection-validation augment;final evaluation is clean.
# The SCNet file is local and explicit;no production constructor downloads it.
# Full FFPP training,GPU/AMP and historical scores remain unverified.
# CPU saved activations are exact and retained. The20GiB cumulative budget
# intentionally rejects longer jobs before storage exhaustion. Set an explicit
# suitable storage budget for larger runs;do not split batches or lower dtype.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: /absolute/path/to/stil-runs
model:
  factory: detectors.stil.experiment:create_task
  init_weights: /absolute/path/to/scnet50_v1d-4109d1e1.pth
  score_type: probability
  selection_seed: 1024
loader:
  batch_size: 8
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-all-frames.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-all-frames.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-all-frames.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 11
  monitor: clip.auc
  learning_rate: 0.0002
  weight_decay: 0.0005
  disk_saved_tensors: true
  saved_activation_budget_gib: 20
  disk_reserve_gib: 8
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  # Frame-specific category/attributes are not merged into clip-level groups.
  group_by: []
