# Fit the mapping from FF++ source rows by default. For the exact paper fit,
# add model.mapping_path with path to the frozen FFpp-mapping.npz and
# sha256: 41c1943db515f570ccddc6d402e659c3c3e3f032f17b5e79d95319bae531486e
version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: ../../outputs/lightning/ffpp
model:
  factory: detectors.lightning.task:LightningTask
loader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  decode_error_patience: 10
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    split: train
  validation:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    split: val
  ffpp_test:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-test-frames-32.jsonl
    split: test
  ufd_test:
    dataset: UniversalFakeDetect
    manifest: ${MANIFEST_ROOT}/UniversalFakeDetect-test.jsonl
    split: test
fit:
  input: training
  validation_input: validation
  # Validation is report-only; no epochs, patience, head/layer selection or LDA.
evaluation:
  inputs:
  - ffpp_test
  - ufd_test
  threshold: 0.0
  video_aggregation: mean
  group_by:
  - category
video_sampling:
  name: train8_test32
  train_frames: 8
  test_frames: 32
