# Frozen fixed-eight mapping; new fits use a single uniform ridge coefficient.
version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: ../../outputs/lightning/ffpp
model:
  factory: detectors.lightning.task:LightningTask
  route: ffpp
  backbone_id: openai/clip-vit-large-patch14
  revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  local_files_only: true
  mapping_path: ${WEIGHT_ROOT}/lightning-fixed8-mapping.npz
  ridge_lambda: 0.15
loader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  decode_error_patience: 10
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    split: train
  validation:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    split: val
  ffpp_test:
    dataset: FaceForensics++
    manifest: ${MANIFEST_ROOT}/FaceForensics++-test-frames-32.jsonl
    split: test
  ufd_test:
    dataset: UniversalFakeDetect
    manifest: ${MANIFEST_ROOT}/UniversalFakeDetect-test.jsonl
    split: test
fit:
  input: training
  validation_input: validation
  # Validation is report-only; no epochs, patience, head/layer selection or LDA.
evaluation:
  inputs:
  - ffpp_test
  - ufd_test
  threshold: 0.0
  video_aggregation: mean
  group_by:
  - category
video_sampling:
  name: train8_test32
  train_frames: 8
  test_frames: 32
