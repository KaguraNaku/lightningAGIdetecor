# Remake source-validation policy. Source selection is uniform manifest sampling,
# not a claim of original DeepfakeBench sample membership or full reproduction.
# Launch under tools/bounded_run.py; this config does not trigger training itself.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/lora_ffpp
model:
  factory: detectors.lora.experiment:create_task
  backbone_id: openai/clip-vit-large-patch14
  revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  local_files_only: true
  attention_implementation: sdpa
  lora_r: 16
  lora_alpha: 16
  # initial_checkpoint: /absolute/path/to/legacy-lora.pth
  # legacy_weight_mode: merged  # Required for legacy imports; inspect its save mode.
loader:
  batch_size: 8
  num_workers: 0
  shuffle: false
  persistent_workers: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 10
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  group_by: [category]
