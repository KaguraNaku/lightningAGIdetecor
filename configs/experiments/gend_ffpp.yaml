# Author method under the common strict train8/test32, source-only validation protocol.
version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: ../../outputs/author-8-32/ffpp/gend
model:
  factory: detectors.gend.task:GenDTask
  head: LinearNorm
  augmentation: true
  initialization: pretrained_backbone
  backbone_id: openai/clip-vit-large-patch14
  revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  training_profile: author_ln_l2_ua
loader:
  batch_size: 128
  num_workers: 4
  persistent_workers: false
  shuffle: false
  pin_memory: true
  prefetch_factor: 2
  decode_error_patience: 1
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  ffpp_test:
    dataset: FaceForensics++
    split: test
    manifest: ${MANIFEST_ROOT}/FaceForensics++-test-frames-32.jsonl
    batch_size: 32
  ufd_test:
    dataset: UniversalFakeDetect
    split: test
    manifest: ${MANIFEST_ROOT}/UniversalFakeDetect-test.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 30
  patience: 3
  monitor: video.auc
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0
  min_delta: 0.0001
  min_learning_rate: 1.0e-06
  cycle_epochs: 10
  warmup_epochs: 0
evaluation:
  inputs:
  - validation
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
video_sampling:
  name: train8_test32
  train_frames: 8
  test_frames: 32
