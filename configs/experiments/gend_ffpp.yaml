# GenD CLIP-L/14 with the pinned cached published LinearNorm checkpoint.
# Loading is offline-only. For explicit raw imports, add initial_checkpoint
# and retain the explicit head setting; tensor layout cannot identify normalization.
# Native train/eval batch24/32 and epochs0..10, with source CLIP normalization.
# This FFPP example uses remake manifests/selection, not the full original protocol.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/gend_ffpp
model:
  factory: detectors.gend.experiment:create_task
  head: LinearNorm
  augmentation: false
loader:
  batch_size: 24
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 11
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
