# Full native UIA-ViT B/16, RGB224 and batch64, CE/PCL and bank collection.
# Labeled evaluation also collects patch banks and advances the native counter.
# Fill init_weights with the local ImageNet file. For random initialization,
# remove init_weights and set initialization: random. This FFPP source-validation example
# differs from the original sampling and selection protocol.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/uia_vit_ffpp
model:
  factory: detectors.uia_vit.experiment:create_task
  augmentation: false
  nEpochs: 10
  batch_per_epoch: 1796
  init_weights: /absolute/path/to/jx_vit_base_p16_224-80ecf9dd.pth
loader:
  batch_size: 64
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 11
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.00003
  weight_decay: 0.00001
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
