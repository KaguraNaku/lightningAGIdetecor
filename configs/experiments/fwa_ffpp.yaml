# Native FWA: source batch16 -> whole model batch32; RGB256, frames32, eleven sweeps.
# Generation augmentations remain active even though source global augmentation isFalse.
# These remake FFPP manifests/validation selection differ from original FF-NT protocol.
# Install optional fwa dependencies, fill both explicit local model/predictor paths.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/fwa_ffpp
model:
  factory: detectors.fwa.experiment:create_task
  init_weights: /absolute/path/to/xception-b5690688.pth
  predictor_path: /absolute/path/to/shape_predictor_81_face_landmarks.dat
loader:
  batch_size: 16
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 11
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
