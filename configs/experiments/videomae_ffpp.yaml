# Native VideoMAE-base RGB224/T16,whole batch8,two-logit CE,11 epochs.
# Explicit local init_weights must match the pinned MCG-NJU schema.
# No weight download is performed. Source landmarks are hash/absence-bound;
# missing files yield native81xy zeros. Train AND validation are augmented.
# Full eager CPU forward and constructed-state evaluate CLI align with selected
# source numerical bodies. Full backward,fitted CLI and full-corpus reproduction
# remain unverified. Run heavy work only inside hard limits.
# Retained activations require sufficient fresh storage plus8GiB reserve.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: /absolute/path/to/videomae-runs
model:
  factory: detectors.videomae.experiment:create_task
  init_weights: /absolute/path/to/videomae-base/model.safetensors
  selection_seed: 1024
loader:
  batch_size: 8
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-all-frames.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-all-frames.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-all-frames.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 11
  monitor: clip.auc
  learning_rate: 0.0002
  weight_decay: 0.0005
  disk_saved_tensors: true
  saved_activation_budget_gib: 20
  disk_reserve_gib: 8
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  # Frame-specific category/attributes are not merged into clip-level groups.
  group_by: []
