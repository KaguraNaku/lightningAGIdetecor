# Explicit source lmdb=True per-key decode-format override using exported bytes.
# Formal train_config.yaml uses lmdb=False;its gray masks fail native synthesis.
# Native32 pairs->64 views;0..40 inclusive41 epochs;native step validation cadence.
# Exact CPU saved tensors are retained. Preflight requires complete declared-run
# capacity,8GiB disk reserve and2GiB checkpoint headroom before model/Adam updates.
# Full native64 forward/backward/fitted experiment is not yet verified.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: /absolute/path/to/sladd-runs
model:
  factory: detectors.sladd.experiment:create_task
  init_weights: /absolute/path/to/xception-b5690688.pth
  data_profile: source_lmdb_rgb_bytes
  score_type: probability
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-sladd-byte-bindings.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 41
  monitor: image.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
  disk_saved_tensors: true
  disk_reserve_gib: 8
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  group_by: []
