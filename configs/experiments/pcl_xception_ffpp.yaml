# Original SLADD-Xception + PCL, CE+BCE raw first-column4D targets.
# Prepare provided neighbor bank against EXACT train manifest; NPY sidecars retain dtype.
# Every member needs pcl_bank_id; explicit landmarks metadata supports relocated sidecars.
# Stable real-only dedup replaces hash-set order. Foregrounds must all bind train data.
# Native source32 -> whole model64; this config needs appropriate runtime resources.
# CPU validation uses separate miniature whole batches under tools/bounded_run.py.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/pcl_xception_ffpp
model:
  factory: detectors.pcl_xception.experiment:create_task
  init_weights: /absolute/path/to/xception-b5690688.pth
  bank_path: /absolute/path/to/prepared/i2g-bank/bank.json
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 151
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
