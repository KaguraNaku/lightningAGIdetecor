# Native HRNetW48, CE+1000 raw-boundary MSE; source16 -> whole model32.
# Prepare bank.json against THIS exact train manifest before running.
# Provided neighbor lists must resolve fully inside training inventory.
# Explicit training_kdtree preparation is a declared protocol/input-bank change.
# This remake sampling/validation setup is not original full FFBlend reproduction.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/facexray_ffpp
model:
  factory: detectors.facexray.experiment:create_task
  init_weights: /absolute/path/to/hrnetv2_w48_imagenet_pretrained.pth
  bank_path: /absolute/path/to/prepared/train-bank/bank.json
loader:
  batch_size: 16
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 11
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
