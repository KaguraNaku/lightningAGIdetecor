# FTCN stop5 RGB224/T16, whole batch8, sigmoid BCE, inclusive11 epochs.
# Explicit FTCN factory repairs native ftcn.yaml model_name=videomae.
# init_weights is loaded into full I3D BEFORE fresh temporal conversion.
# Native Kinetics/historical assets are not bundled or verified.
# Full forward parity was verified only in an audit ATen CPU/no_grad mapped
# profile. Full CNN backward, fitted Task CLI and full-corpus reproduction
# remain unverified. This training path does not use that no_grad transport.
# Run heavy work only inside explicit resource limits; native full batch8
# exceeds3GiB without separately validated training transport.
# All activations/failures are retained; never lower the8GiB disk reserve.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: /absolute/path/to/ftcn-runs
model:
  factory: detectors.ftcn.experiment:create_task
  init_weights: /absolute/path/to/I3D_8x8_R50.pth
  selection_seed: 1024
loader:
  batch_size: 8
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-all-frames.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-all-frames.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-all-frames.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 11
  monitor: clip.auc
  learning_rate: 0.0002
  weight_decay: 0.0005
  disk_saved_tensors: true
  saved_activation_budget_gib: 20
  disk_reserve_gib: 8
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  # Frame-specific category/attributes are not merged into clip-level groups.
  group_by: []
