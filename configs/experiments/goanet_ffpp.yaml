# Canonical GOANet, full CLIP-L/14 and 32-tail SVD. Fixed variant is unconnected.
# Literal source scheduling: warmup1 plus a single post-fit step keeps body lr0.
# BN statistics change, but parameters do not numerically learn in this recipe.
# For explicit active updates use the separate warmup-disabled configuration.
# Native batch24/frames8 and eleven sweeps; no full experiment reproduction claim.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/goanet_ffpp_source_literal
model:
  factory: detectors.goanet.experiment:create_task
  source_variant: canonical_prior_guided
  augmentation: true
loader:
  batch_size: 24
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-8.jsonl
    batch_size: 24
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-8.jsonl
    batch_size: 24
fit:
  input: training
  validation_input: validation
  epochs: 11
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0005
  warmup_epoch: 1
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
