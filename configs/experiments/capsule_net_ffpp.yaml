# Native CapsuleNet RGB256, trainable VGG19, ten capsules and probability-input CE.
# Fill init_weights with the local ImageNet VGG file. To construct random weights,
# remove init_weights and explicitly set initialization: random. Native epochs0..10
# imply 11 sweeps. This FFPP source-validation example is not the original full protocol.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/capsule_net_ffpp
model:
  factory: detectors.capsule_net.experiment:create_task
  augmentation: false
  init_weights: /absolute/path/to/vgg19-dcbb9e9d.pth
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 11
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 8.0e-05
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
