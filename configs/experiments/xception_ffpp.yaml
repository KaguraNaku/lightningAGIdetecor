# Native network/batch settings with the remake source-validation selection
# policy. Fill in the local ImageNet initialization path before using this file.
# Whole batches are retained: silently microbatching changes BatchNorm behavior.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/xception_ffpp
model:
  factory: detectors.xception.experiment:create_task
  mode: original
  init_weights: /absolute/path/to/xception-b5690688.pth
  # To train from scratch, remove init_weights and set initialization: random.
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 10
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  group_by: [category]
