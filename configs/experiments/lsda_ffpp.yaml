# Default LSDA: whole batch10/G2, four B4 fake branches, B4 student,
# source-random partially frozen IResNet100 content;51 inclusive sweeps.
# First prepare the grouped train manifest with detectors.lsda.manifest.
# Preserve all32 existing slots/video; supply official train pairs explicitly.
# Use persistent output storage with room for activation spill/checkpoints.
# Source-validation selection and remake worker seeding are explicit policies;
# this preset does not claim original full-protocol/score reproduction.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: /absolute/path/to/lsda-runs
model:
  factory: detectors.lsda.experiment:create_task
  init_weights: /absolute/path/to/efficientnet-b4-6ed6700e.pth
  max_decode_attempts: 32
  specific_label_map:
    youtube: 0
    Deepfakes: 1
    Face2Face: 2
    FaceSwap: 3
    NeuralTextures: 4
loader:
  batch_size: 10
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-lsda.jsonl
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 51
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
  disk_saved_tensors: true
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
