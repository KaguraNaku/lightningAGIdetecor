# Author SBIPlusV2 method with source-only selection and enforced train8/test32.
version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: ../../outputs/author-8-32/ffpp/prodet
model:
  factory: detectors.prodet.task:ProDetTask
  init_weights: ${WEIGHT_ROOT}/efficientnet-b4-6ed6700e.pth
  data_profile: specialized_quadruples
  training_neighbors: ${MANIFEST_ROOT}/FaceForensics++-train-prodet-bindings.neighbors.json
  score_type: probability
loader:
  batch_size: 32
  num_workers: 4
  persistent_workers: false
  shuffle: false
  pin_memory: true
  prefetch_factor: 2
  decode_error_patience: 1
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-prodet-bindings.jsonl
    batch_size: 24
    num_workers: 8
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  ffpp_test:
    dataset: FaceForensics++
    split: test
    manifest: ${MANIFEST_ROOT}/FaceForensics++-test-frames-32.jsonl
    batch_size: 32
  ufd_test:
    dataset: UniversalFakeDetect
    split: test
    manifest: ${MANIFEST_ROOT}/UniversalFakeDetect-test.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 21
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
  betas: [0.9, 0.999]
  eps: 0.00000001
  disk_saved_tensors: false
  disk_reserve_gib: 8
  patience: null
  min_delta: 0.0
evaluation:
  inputs:
  - validation
  threshold: 0.5
  video_aggregation: mean
  group_by: []
video_sampling:
  name: train8_test32
  train_frames: 8
  test_frames: 32
