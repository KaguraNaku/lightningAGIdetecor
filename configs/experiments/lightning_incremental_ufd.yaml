version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  output_dir: ../../outputs/lightning/incremental_FFpp_UFD
model:
  factory: detectors.lightning.task:LightningTask
  # Start with FF++ model.pth. For later fits use the previous fit's model.pth
  # and set dataset to UniversalFakeDetect.
  checkpoint:
    path: ${LIGHTNING_CHECKPOINT}
    dataset: FaceForensics++
loader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  shuffle: false
inputs:
  training:
    dataset: UniversalFakeDetect
    split: train
    manifest: ${MANIFEST_ROOT}/UFD-new-1-400.jsonl
  validation:
    dataset: UniversalFakeDetect
    split: val
    manifest: ${MANIFEST_ROOT}/UFD-source-validation-400.jsonl
  ufd_test:
    dataset: UniversalFakeDetect
    split: test
    manifest: ${MANIFEST_ROOT}/UniversalFakeDetect-test.jsonl
  ffpp_test:
    dataset: FaceForensics++
    split: test
    manifest: ${MANIFEST_ROOT}/FaceForensics++-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
evaluation:
  inputs: [ufd_test, ffpp_test]
  threshold: 0.0
video_sampling:
  name: train8_test32
  train_frames: 8
  test_frames: 32
