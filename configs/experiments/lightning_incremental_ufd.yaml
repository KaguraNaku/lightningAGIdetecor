version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  output_dir: ../../outputs/lightning/incremental_FFpp_UFD
model:
  factory: detectors.lightning.task:LightningTask
  # Stage 1 uses the fitted FF++ model.pth. Later stages keep chain_id,
  # advance stage_index and point at the previous stage's model.pth.
  # Set dataset to that checkpoint's training source when using this check.
  chain_id: ffpp-ufd
  stage_index: 1
  parent_checkpoint:
    path: ${LIGHTNING_PARENT_CHECKPOINT}
    dataset: FaceForensics++
loader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  shuffle: false
inputs:
  training:
    dataset: UniversalFakeDetect
    split: train
    manifest: ${MANIFEST_ROOT}/UFD-new-1-400.jsonl
  validation:
    dataset: UniversalFakeDetect
    split: val
    manifest: ${MANIFEST_ROOT}/UFD-source-validation-400.jsonl
  ufd_test:
    dataset: UniversalFakeDetect
    split: test
    manifest: ${MANIFEST_ROOT}/UniversalFakeDetect-test.jsonl
  ffpp_test:
    dataset: FaceForensics++
    split: test
    manifest: ${MANIFEST_ROOT}/FaceForensics++-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
evaluation:
  inputs: [ufd_test, ffpp_test]
  threshold: 0.0
video_sampling:
  name: train8_test32
  train_frames: 8
  test_frames: 32
