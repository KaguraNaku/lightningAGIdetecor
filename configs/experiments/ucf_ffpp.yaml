# Cloud-verified source fit settings; choose test inputs explicitly through the common CLI.
version: 1
seed: 1024
runtime:
  device: cuda:0
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: ../../outputs/ffpp/ucf
model:
  factory: detectors.ucf.experiment:create_task
  init_weights: ${WEIGHT_ROOT}/xception-b5690688.pth
  specific_classes: 5
  specific_label_map:
    youtube: 0
    Deepfakes: 1
    Face2Face: 2
    FaceSwap: 3
    NeuralTextures: 4
loader:
  batch_size: 16
  num_workers: 4
  persistent_workers: false
  shuffle: false
  pin_memory: true
  prefetch_factor: 2
  decode_error_patience: 1
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-8.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  ffpp_test:
    dataset: FaceForensics++
    split: test
    manifest: ${MANIFEST_ROOT}/FaceForensics++-test-frames-32.jsonl
  ufd_test:
    dataset: UniversalFakeDetect
    split: test
    manifest: ${MANIFEST_ROOT}/UniversalFakeDetect-test.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 6
  patience: 3
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
  min_delta: 0.0001
evaluation:
  inputs:
  - validation
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
