# Checked local RFM feature-target/FAM-parameter-gradient recipe.
# Native mask geometry is 256, three ranked points, rectangle bound 120.
# Fill local ImageNet init_weights; for random initialization, remove it
# and set initialization: random. This uses remake manifests and source
# validation; original sample membership and selection are not reproduced.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/rfm_ffpp
model:
  factory: detectors.rfm.experiment:create_task
  mode: original
  init_weights: /absolute/path/to/xception-b5690688.pth
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 10
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
