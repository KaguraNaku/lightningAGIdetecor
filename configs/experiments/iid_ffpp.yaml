# Native IID: adjusted512 Xception + TRAINABLE IResNet50, 1000 identity classes.
# Supply BOTH original initializers, including recognition-pretrained backbone.pth.
# Training identity_index comes from metadata or native numeric parent-folder tail.
# Mixed-label whole batches are required by literal EIC; no automatic balancing.
# Batch1 inference bypasses final identity BN, as in source; keep evaluation batches.
# Native defaults: source32, RGB256/identity112, 11 inclusive sweeps, no scheduler.
# CPU verification uses a separate declared miniature under bounded_run.py.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: outputs/iid_ffpp
model:
  factory: detectors.iid.experiment:create_task
  init_weights: /absolute/path/to/xception-b5690688.pth
  explicit_weights: /absolute/path/to/recognition-pretrained-backbone.pth
loader:
  batch_size: 32
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-frames-32.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-frames-32.jsonl
    batch_size: 32
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-frames-32.jsonl
    batch_size: 32
fit:
  input: training
  validation_input: validation
  epochs: 11
  patience: null
  monitor: video.auc
  optimizer: adam
  learning_rate: 0.0002
  weight_decay: 0.0005
evaluation:
  inputs:
  - validation
  - celeb_df_v2_test
  threshold: 0.5
  video_aggregation: mean
  group_by:
  - category
