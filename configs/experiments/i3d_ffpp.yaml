# Native RGB224/T16, whole batch8, probability BCE, inclusive31 epochs.
# Prepare unlimited all-frame manifests and their files-first metadata sidecars;
# uniformly sampled image manifests cannot supply the native temporal pool.
# The native Kinetics asset is not bundled; its actual weights were unavailable
# for validation. Use initialization: random only for explicit constructed runs.
# Verified profile: CPU/fp32 native parity and a2-epoch fixture CLI workflow.
# This full-FFPP preset, GPU/AMP and historical trained scores are unverified.
# CPU activations are retained. The20GiB write budget intentionally stops before
# storage is exhausted; a long run needs an explicitly sized storage budget or
# a separate GPU profile. No activation cleanup or batch splitting is performed.
version: 1
seed: 1024
runtime:
  device: cpu
  precision: fp32
  allow_tf32: false
  log_level: INFO
  output_dir: /absolute/path/to/i3d-runs
model:
  factory: detectors.i3d.experiment:create_task
  init_weights: /absolute/path/to/I3D_8x8_R50.pth
  selection_seed: 1024
loader:
  batch_size: 8
  num_workers: 0
  persistent_workers: false
  shuffle: false
inputs:
  training:
    dataset: FaceForensics++
    split: train
    manifest: ${MANIFEST_ROOT}/FaceForensics++-train-all-frames.jsonl
    shuffle: true
  validation:
    dataset: FaceForensics++
    split: val
    manifest: ${MANIFEST_ROOT}/FaceForensics++-val-all-frames.jsonl
  celeb_df_v2_test:
    dataset: Celeb-DF-v2
    split: test
    manifest: ${MANIFEST_ROOT}/Celeb-DF-v2-test-all-frames.jsonl
fit:
  input: training
  validation_input: validation
  epochs: 31
  monitor: clip.auc
  learning_rate: 0.0002
  weight_decay: 0.0005
  disk_saved_tensors: true
  saved_activation_budget_gib: 20
  disk_reserve_gib: 8
evaluation:
  inputs: [validation, celeb_df_v2_test]
  threshold: 0.5
  video_aggregation: mean
  # Frame-specific category/attributes are not merged into clip-level groups.
  group_by: []
