[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-remake"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
  "torch>=2", "transformers>=4.30", "numpy>=1.24", "scikit-learn>=1.3",
  "pyyaml>=6", "Pillow>=10", "albumentations>=1.3", "pyarrow>=14",
  "opencv-python-headless>=4.8",
]

[project.scripts]
lightning-calibrate = "lightning_detector.cli:calibrate_main"
lightning-test = "lightning_detector.cli:test_main"
lightning-layer-search = "lightning_detector.cli:search_main"

[tool.setuptools.packages.find]
include = ["lightning_detector*"]

[dependency-groups]
dev = ["ruff>=0.15.17"]

[tool.ruff.lint]
select = ["F", "B"]
ignore = ["B904"]
