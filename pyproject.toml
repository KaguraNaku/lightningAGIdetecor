[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-detector"
version = "0.1.0"
description = "Nine lazily loaded image forensic detectors and their experiment engine"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.9.1", "torchvision>=0.24", "transformers==5.20.2", "numpy>=1.24", "scikit-learn>=1.3",
  "pyyaml>=6", "Pillow>=10", "albumentations==1.3.1", "pyarrow>=14",
  "opencv-python-headless==4.11.0.86", "python-dotenv>=1.0",
  "huggingface-hub>=0.34", "safetensors>=0.4.3", "scipy>=1.11",
]

[project.scripts]
engine = "engine.cli:main"

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.setuptools.packages.find]
include = ["backbones*", "models*", "detectors*", "data*", "configs*", "engine*"]

[tool.setuptools.package-data]
configs = ["*.yaml", "manifests/*.jsonl"]
"detectors.forada" = ["*.json", "LICENSE.*", "README.md"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["experiments", "manifests", "outputs"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "B", "TID251"]
ignore = ["B904"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch.cuda".msg = "Use torch.accelerator or a device-aware API."
"torch.backends.cuda".msg = "Keep CUDA-only backend controls in engine/accelerator.py."
"torch.backends.cudnn".msg = "Keep cuDNN-only backend controls in engine/accelerator.py."
"torch.Tensor.cuda".msg = "Use tensor.to(device)."
"torch.nn.Module.cuda".msg = "Use module.to(device)."
