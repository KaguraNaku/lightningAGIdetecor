[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-remake"
version = "0.1.0"
description = "Nine lazily loaded image forensic detectors and their experiment engine"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.9.1", "transformers>=4.57.3", "numpy>=1.24", "scikit-learn>=1.3",
  "pyyaml>=6", "Pillow>=10", "albumentations==1.3.1", "pyarrow>=14",
  "opencv-python-headless==4.11.0.86", "python-dotenv>=1.0",
  "huggingface-hub>=0.34", "safetensors>=0.4.3",
]

[project.scripts]
prepare-data = "data.cli:prepare_main"
check-data = "data.cli:check_main"

[tool.setuptools.packages.find]
include = ["backbones*", "detectors*", "data*", "configs*", "engine*"]

[tool.setuptools.package-data]
configs = ["*.yaml", "experiments/*.yaml", "migrations/*.json", "benchmarks/*.json", "benchmarks/*.md", "benchmarks/eight/*.yaml"]
"detectors.forada" = ["*.json", "LICENSE.*", "README.md"]

[tool.ruff.lint]
select = ["F", "B"]
ignore = ["B904"]
